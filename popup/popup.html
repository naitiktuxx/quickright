<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native Right-Click Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-group">
      <img class="logo-img" src="../icons/icon-48.png" alt="Icon">
      <div>
        <h2>Native Right-Click</h2>
        <span class="subtitle">Chromium Gesture Companion</span>
      </div>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div class="content">
    <div class="section">
      <label class="section-title">Trigger Activation</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="triggerMode" value="tap">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Stationary Tap</span>
              <span class="tag tag-recommended">Best</span>
            </div>
            <span class="radio-desc">Instant menu on tap. Dragging moves gestures freely.</span>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="triggerMode" value="longpress">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Hold / Long Press</span>
            </div>
            <span class="radio-desc">Hold right-click stationary for 250ms.</span>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="triggerMode" value="double">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Double Right-Click</span>
            </div>
            <span class="radio-desc">Quick double right-click anywhere on page.</span>
          </div>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-head-row">
        <label class="section-title" for="dragThreshold">Gesture Drag Threshold</label>
        <span class="value-badge" id="thresholdValue">5px</span>
      </div>
      <input type="range" id="dragThreshold" min="2" max="16" step="1" value="5" class="slider">
      <div class="slider-labels">
        <span>Sensitive (2px)</span>
        <span>Relaxed (16px)</span>
      </div>
    </div>

    <div class="section">
      <label class="section-title">Glass Theme</label>
      <div class="theme-grid">
        <button type="button" class="theme-card" data-theme="auto">
          <span class="theme-icon">🌓</span>
          <span class="theme-name">System</span>
        </button>
        <button type="button" class="theme-card" data-theme="dark">
          <span class="theme-icon">🌑</span>
          <span class="theme-name">Dark Glass</span>
        </button>
        <button type="button" class="theme-card" data-theme="light">
          <span class="theme-icon">☀️</span>
          <span class="theme-name">Light Glass</span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="savedIndicator">Settings saved</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
