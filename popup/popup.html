<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native Right-Click Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-group">
      <img class="logo-img" src="../icons/icon-48.png" alt="Icon">
      <div>
        <h2>Native Right-Click</h2>
        <span class="subtitle">Chromium Gesture Companion</span>
      </div>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div class="content">
    <div class="section">
      <label class="section-title">Trigger Activation</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="triggerMode" value="tap">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Stationary Tap</span>
              <span class="tag tag-recommended">Best</span>
            </div>
            <span class="radio-desc">Instant menu on tap. Dragging moves gestures freely.</span>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="triggerMode" value="longpress">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Hold / Long Press</span>
            </div>
            <span class="radio-desc">Hold right-click stationary for 250ms.</span>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="triggerMode" value="double">
          <div class="radio-info">
            <div class="radio-head">
              <span class="radio-label">Double Right-Click</span>
            </div>
            <span class="radio-desc">Quick double right-click anywhere on page.</span>
          </div>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-head-row">
        <label class="section-title" for="dragThreshold">Gesture Drag Threshold</label>
        <span class="value-badge" id="thresholdValue">5px</span>
      </div>
      <input type="range" id="dragThreshold" min="2" max="16" step="1" value="5" class="slider">
      <div class="slider-labels">
        <span>Sensitive (2px)</span>
        <span>Relaxed (16px)</span>
      </div>
    </div>

    <div class="section">
      <label class="section-title">Glass Theme</label>
      <div class="theme-grid">
        <button type="button" class="theme-card" data-theme="auto">
          <svg class="theme-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18v-8c-4.42 0-8 3.58-8 8s3.58 8 8 8z" fill="currentColor"/></svg>
          <span class="theme-name">System</span>
        </button>
        <button type="button" class="theme-card" data-theme="dark">
          <svg class="theme-svg" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 9.6-6.8 1 1 0 0 0-1.2-1.3 8 8 0 1 1-7.8-10.7 1 1 0 0 0-1.3-1.2h-.4z" fill="currentColor"/></svg>
          <span class="theme-name">Dark Glass</span>
        </button>
        <button type="button" class="theme-card" data-theme="light">
          <svg class="theme-svg" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" fill="currentColor"/></svg>
          <span class="theme-name">Light Glass</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="toggle-group">
        <div class="toggle-row">
          <div>
            <label class="toggle-label" for="lockScrollWhenOpen">Lock Background Scroll</label>
            <span class="toggle-desc">Prevent webpage scrolling while context menu is open</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="lockScrollWhenOpen">
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div>
            <label class="toggle-label" for="disableAnimations">Disable Animations</label>
            <span class="toggle-desc">Opens menu instantly with zero transition delay</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="disableAnimations">
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="savedIndicator">Settings saved</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
